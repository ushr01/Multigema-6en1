services:
  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: multigema
    volumes:
      - dbdata:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
  api:
    build: ./server
    restart: always
    env_file: .env
    environment:
      DB_HOST: db
    depends_on: [db]
    ports: ["4000:4000"]
  web:
    build: ./client
    restart: always
    ports: ["80:80"]
    depends_on: [api]
volumes:
  dbdata:
