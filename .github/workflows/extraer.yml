name: Extraer proyecto

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extraer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verificar ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f multigema.zip ]; then
            echo "ERROR: falta multigema.zip en la raíz del repositorio"
            exit 1
          fi

          echo "Contenido del ZIP:"
          unzip -l multigema.zip | head -n 40

      - name: Extraer proyecto
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/multigema_extract
          mkdir -p /tmp/multigema_extract

          unzip -o multigema.zip -d /tmp/multigema_extract

          echo "Estructura extraída:"
          find /tmp/multigema_extract -maxdepth 5 -print

          ROOT_DIR="$(find /tmp/multigema_extract -mindepth 1 -maxdepth 5 -type d -name multigema -print -quit)"

          if [ -z "${ROOT_DIR}" ]; then
            echo "ERROR: no encontré la carpeta multigema dentro del ZIP"
            find /tmp/multigema_extract -maxdepth 6 -print
            exit 1
          fi

          echo "Carpeta detectada: ${ROOT_DIR}"

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          cp -a "${ROOT_DIR}/." .

      - name: Commit y push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="${GITHUB_REF_NAME:-$(git branch --show-current 2>/dev/null || echo main)}"
          git checkout -B "$BRANCH"
          git add -A

          if git diff --cached --quiet; then
            echo "No hay cambios para hacer commit"
            exit 0
          fi

          git commit -m "Extrae proyecto multigema.zip"
          git push origin HEAD:"$BRANCH"
