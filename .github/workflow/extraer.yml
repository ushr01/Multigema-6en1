name: Extraer proyecto
on: workflow_dispatch
permissions:
  contents: write
jobs:
  extraer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer el zip
        run: |
          ls -la
          ZIP=$(ls *.zip | head -n 1)
          echo "Usando: $ZIP"
          mkdir tmp_extract
          unzip -o "$ZIP" -d tmp_extract
          if [ "$(ls tmp_extract | wc -l)" = "1" ] && [ -d "tmp_extract/$(ls tmp_extract)" ]; then
            cp -r tmp_extract/*/. .
          else
            cp -r tmp_extract/. .
          fi
          rm -rf tmp_extract
      - name: Subir los cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet && echo "No hay cambios" || (git commit -m "Extrae proyecto multigema" && git push)
