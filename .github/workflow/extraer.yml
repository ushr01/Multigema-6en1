name: Extraer proyecto

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extraer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar zip
        run: |
          pwd
          ls -la
          test -f multigema.zip || { echo "Falta multigema.zip en la raíz del repo"; exit 1; }

      - name: Extraer proyecto
        run: |
          unzip -o multigema.zip
          if [ -d multigema ]; then
            cp -r multigema/. .
            rm -rf multigema
          else
            echo "La carpeta multigema no existe dentro del zip"
            exit 1
          fi

      - name: Commit y push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -B "${GITHUB_REF_NAME:-main}"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios para hacer commit"
            exit 0
          fi
          git commit -m "Extrae proyecto multigema"
          git push origin HEAD:"${GITHUB_REF_NAME:-main}"
